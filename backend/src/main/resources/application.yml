# Configuration values come from environment variables.
# For local development, put them in backend/.env (gitignored). See backend/.env.example.
spring:
  application:
    name: accessflow
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Schema is owned by Flyway migrations only.
  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
  web:
    resources:
      # Built frontend (production). Falls back to the classpath when the directory does not exist.
      static-locations: file:${ACCESSFLOW_FRONTEND_DIR:../frontend/dist}/,classpath:/static/

server:
  port: ${SERVER_PORT:8080}
  # Compress text responses: essential on slow 3G (JavaScript ~280 KB -> ~90 KB).
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,application/problem+json,image/svg+xml
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}   # Generous: no forced short timeouts. Drafts are saved server-side anyway.
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}   # Set COOKIE_SECURE=true in production (HTTPS).
        name: AF_SESSION
  error:
    include-stacktrace: never
    include-message: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

accessflow:
  version: '@project.version@'
  storage-dir: ${ACCESSFLOW_STORAGE_DIR:./storage}
  # Optional AI assistant provider. Leave ANTHROPIC_API_KEY unset to use the local approved-help fallback.
  assistant:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${ACCESSFLOW_AI_MODEL:claude-opus-5-5}
