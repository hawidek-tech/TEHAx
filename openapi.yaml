openapi: 3.1.0
info:
  title: ACCESSFLOW API
  description: "Accessible onboarding and job applications (DIGITAL BRIDGE Accessibility\
    \ Hackathon 2026, Track 1). First-party clients use a session cookie plus the\
    \ X-XSRF-TOKEN header; embedded components send X-AccessFlow-Embed and then 'Authorization:\
    \ Bearer <embedToken>'. Errors are RFC 7807 problem details with a translatable\
    \ 'code'. Learners can only access their own records (other ids return 404)."
  license:
    name: See THIRD_PARTY_LICENSES.md
  version: 0.1.0-SNAPSHOT
servers:
- url: http://localhost:8081
  description: Generated server url
tags:
- name: Help
  description: Approved help content (works without AI)
- name: Profile
  description: The signed-in user's reusable profile. Owner-only.
- name: Jobs
  description: Accessible job discovery. The 'support' filter is private and never
    stored or shared.
- name: Support staff
  description: Identity verification and private support queues (SUPPORT_STAFF only)
- name: Files
  description: "Protected uploads (identity documents, CVs). Owner-only access."
- name: Authentication
  description: "Registration, sign-in and sessions. First-party clients use a session\
    \ cookie + CSRF header; embedded components send X-AccessFlow-Embed and receive\
    \ a short-lived bearer token instead (no third-party cookies)."
- name: Identity verification
  description: Alternative identification routes. Every route is reviewed by authorised
    staff.
- name: Assistant
  description: Optional help assistant grounded in approved help content
- name: Embedding
  description: Configuration for <accessflow-*> Web Components
- name: Account
  description: Data export and account deletion
- name: Applications
  description: "The signed-in applicant's job applications, status tracking and consents"
- name: Private support
  description: Help requests without medical proof. Visible only to the requester
    and support staff.
- name: Employer
  description: "Jobs, accommodation information and received applications (EMPLOYER\
    \ only)"
- name: Form engine
  description: Flow definitions and server-side drafts (save & resume)
paths:
  /api/v1/saved-jobs/{jobId}:
    put:
      tags:
      - Jobs
      summary: Save a job
      operationId: save
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
    delete:
      tags:
      - Jobs
      summary: Remove a saved job
      operationId: unsave
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
  /api/v1/profile:
    get:
      tags:
      - Profile
      summary: My profile
      operationId: get
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProfileDto"
    put:
      tags:
      - Profile
      summary: Edit my profile (same field ids and validation as the profile flow)
      operationId: update
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProfileDto"
  /api/v1/profile/support-preferences:
    put:
      tags:
      - Profile
      summary: Update my PRIVATE workplace-support preferences (used only for my own
        job filtering)
      operationId: supportPreferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportPreferencesRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProfileDto"
  /api/v1/profile/steps:
    put:
      tags:
      - Profile
      summary: "Save only some profile questions (one part of the guided profile,\
        \ or what an application needs)"
      description: "`steps` lists profile step ids, e.g. `fatherName,region,headline,skills`.\
        \ Other fields are unchanged."
      operationId: saveSteps
      parameters:
      - name: steps
        in: query
        required: true
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProfileDto"
  /api/v1/profile/resume:
    put:
      tags:
      - Profile
      summary: "Attach (or remove, with null) my CV"
      operationId: resume
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProfileDto"
  /api/v1/preferences:
    get:
      tags:
      - Accessibility preferences
      operationId: get_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PreferencesDto"
    put:
      tags:
      - Accessibility preferences
      operationId: update_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PreferencesDto"
  /api/v1/learners/{id}/support:
    put:
      tags:
      - Learners (Track 1 data contract)
      summary: Replace the learner's PRIVATE support preferences; optionally open
        a private support request. Never shared with employers.
      operationId: support
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportUpdate"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SupportState"
  /api/v1/employer/jobs/{id}:
    get:
      tags:
      - Employer
      summary: One of my organisation's jobs (any status)
      operationId: job
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JobDetail"
    put:
      tags:
      - Employer
      summary: Update a job and its accommodation information
      operationId: update_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JobDetail"
  /api/v1/drafts/{flowKey}:
    get:
      tags:
      - Form engine
      summary: Get my draft for a flow (context = job id for applications)
      operationId: get_2
      parameters:
      - name: flowKey
        in: path
        required: true
        schema:
          type: string
          pattern: "[a-z-]{1,40}"
      - name: context
        in: query
        required: false
        schema:
          type: string
          default: ""
          maxLength: 64
          minLength: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DraftDto"
    put:
      tags:
      - Form engine
      summary: Save my draft. Send expectedVersion to detect edits from another device
        (409 draft.conflict).
      operationId: save_1
      parameters:
      - name: flowKey
        in: path
        required: true
        schema:
          type: string
          pattern: "[a-z-]{1,40}"
      - name: context
        in: query
        required: false
        schema:
          type: string
          default: ""
          maxLength: 64
          minLength: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveDraftRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DraftDto"
    delete:
      tags:
      - Form engine
      summary: Delete my draft
      operationId: delete
      parameters:
      - name: flowKey
        in: path
        required: true
        schema:
          type: string
          pattern: "[a-z-]{1,40}"
      - name: context
        in: query
        required: false
        schema:
          type: string
          default: ""
          maxLength: 64
          minLength: 0
      responses:
        "200":
          description: OK
  /api/v1/support-requests:
    get:
      tags:
      - Private support
      summary: My support requests
      operationId: mine
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportRequestDto"
    post:
      tags:
      - Private support
      summary: Create a private support request (support-request flow)
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SupportRequestDto"
  /api/v1/staff/verifications/{id}/decision:
    post:
      tags:
      - Support staff
      summary: "Record a verification decision (VERIFIED, REJECTED, NEEDS_INFO)"
      operationId: decide
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Decision"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VerificationDto"
  /api/v1/staff/support-requests/{id}/response:
    post:
      tags:
      - Support staff
      summary: Update a support request and reply to the requester
      operationId: respond
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportResponse"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SupportRequestDto"
  /api/v1/onboarding/profile:
    post:
      tags:
      - Profile
      summary: Submit the guided profile flow (profile + identity route + optional
        private support request)
      operationId: onboarding
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OnboardingResponse"
  /api/v1/notifications/{id}/read:
    post:
      tags:
      - Notifications
      operationId: markRead
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
  /api/v1/learners:
    post:
      tags:
      - Learners (Track 1 data contract)
      summary: Create a learner account (same rules as /auth/register) and sign in.
        201 + Location.
      operationId: create_1
      parameters:
      - name: X-AccessFlow-Embed
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /api/v1/jobs/{jobId}/applications:
    post:
      tags:
      - Applications
      summary: Submit an application (validated against the job's application flow)
      operationId: submit
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApplicationSummary"
  /api/v1/identity:
    get:
      tags:
      - Identity verification
      summary: My identity verification requests
      operationId: mine_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerificationDto"
    post:
      tags:
      - Identity verification
      summary: Start a verification (same fields as the identity section of the profile
        flow)
      operationId: start
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VerificationDto"
  /api/v1/files:
    post:
      tags:
      - Files
      summary: Upload a file (PDF/JPEG/PNG for identity documents; PDF/DOCX for CVs;
        max 5 MB)
      operationId: upload
      parameters:
      - name: purpose
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FileDto"
  /api/v1/employer/jobs:
    get:
      tags:
      - Employer
      summary: My organisation's jobs
      operationId: myJobs
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployerJobSummary"
    post:
      tags:
      - Employer
      summary: Create a job with its accommodation information
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JobDetail"
  /api/v1/employer/applications/{id}/status:
    post:
      tags:
      - Employer
      summary: Update an application's status (the applicant is notified)
      operationId: updateStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReceivedApplication"
  /api/v1/consents/{id}/revoke:
    post:
      tags:
      - Applications
      summary: "Withdraw consent: removes shared profile data from the employer's\
        \ view"
      operationId: revoke
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Create an applicant account and sign in
      operationId: register
      parameters:
      - name: X-AccessFlow-Embed
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /api/v1/auth/password:
    post:
      tags:
      - Authentication
      summary: Change password
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Sign out (ends the session or revokes the embed token)
      operationId: logout
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Sign in with email or Ethiopian phone number
      operationId: login
      parameters:
      - name: X-AccessFlow-Embed
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessionResponse"
  /api/v1/assistant/ask:
    post:
      tags:
      - Assistant
      summary: "Ask for help with a question, field, error or next step"
      operationId: ask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AskResponse"
  /api/v1/applications/{id}/withdraw:
    post:
      tags:
      - Applications
      summary: Withdraw one of my applications
      operationId: withdraw
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApplicationSummary"
  /api/v1/account/delete:
    post:
      tags:
      - Account
      summary: Permanently delete my account and all my data (password required)
      operationId: delete_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/v1/learners/{id}:
    delete:
      tags:
      - Learners (Track 1 data contract)
      summary: "Permanently delete the learner and all their data. Body: {\"password\"\
        : \"…\"} (re-authentication). 204."
      operationId: delete_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRequest"
        required: true
      responses:
        "200":
          description: OK
    patch:
      tags:
      - Learners (Track 1 data contract)
      summary: Partially update the learner's profile. Only the fields sent are changed;
        the result is validated with the same rules as the profile form.
      operationId: patch
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProfileDto"
  /api/v1/system/info:
    get:
      tags:
      - system-info-controller
      operationId: info
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SystemInfo"
  /api/v1/staff/verifications:
    get:
      tags:
      - Support staff
      summary: Identity verifications awaiting review
      operationId: verifications
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: array
          default:
          - PENDING
          - NEEDS_INFO
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffVerification"
  /api/v1/staff/verifications/{id}/document:
    get:
      tags:
      - Support staff
      summary: View an uploaded identity document (audited)
      operationId: document
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
  /api/v1/staff/support-requests:
    get:
      tags:
      - Support staff
      summary: Private support requests
      operationId: supportRequests
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: array
          default:
          - OPEN
          - IN_PROGRESS
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffSupportRequest"
  /api/v1/staff/stats:
    get:
      tags:
      - Support staff
      operationId: stats
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StaffStats"
  /api/v1/saved-jobs:
    get:
      tags:
      - Jobs
      summary: My saved jobs
      operationId: saved
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobSummary"
  /api/v1/organizations/referral-partners:
    get:
      tags:
      - Organizations
      operationId: referralPartners
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferralPartner"
  /api/v1/notifications:
    get:
      tags:
      - Notifications
      operationId: list
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationDto"
  /api/v1/learners/{id}/export:
    get:
      tags:
      - Learners (Track 1 data contract)
      summary: Export all of the learner's data (JSON attachment)
      operationId: export
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /api/v1/jobs:
    get:
      tags:
      - Jobs
      summary: Search open jobs
      operationId: search
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: region
        in: query
        required: false
        schema:
          type: string
      - name: workMode
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: support
        in: query
        description: Workplace-support categories the job must offer (private filter)
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobSummary"
  /api/v1/jobs/{id}:
    get:
      tags:
      - Jobs
      summary: "Job details, including the employer's accommodation information"
      operationId: detail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/JobDetail"
